name: Nightly refresh

# Rebuilds the mart layer and retrains the models against Supabase.
#
# Without this, anything typed into the entry form sits in staging.daily_entry
# and never reaches the dashboard - build_marts.py is what folds it in. Running
# it here means nobody has to open a laptop after using the phone form.
#
# 01:00 UTC is 02:00 Berlin in winter, 03:00 in summer. Either way it is after
# close and before anyone looks at the dashboard.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Never let two refreshes overlap - they write the same tables.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Check the secrets are actually set
        run: |
          missing=""
          for k in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All five database secrets present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Connect to Supabase
        run: python src/db.py

      - name: Rebuild the mart layer
        run: python src/build_marts.py

      - name: Retrain the models
        run: python src/run_ml.py

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          from sqlalchemy import text
          from db import engine
          with engine().connect() as c:
              rows = c.execute(text("""
                  SELECT table_name FROM information_schema.tables
                  WHERE table_schema='mart' ORDER BY table_name
              """)).fetchall()
              latest = c.execute(text(
                  "SELECT max(business_date) FROM mart.daily_actuals")).scalar()
              fc = c.execute(text(
                  "SELECT min(full_date), max(full_date) FROM mart.forecast_daily"
              )).fetchone()
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Nightly refresh",
              "",
              f"- mart tables: **{len(rows)}**",
              f"- latest trading day: **{latest}**",
              f"- forecast window: **{fc[0]} to {fc[1]}**",
          ]
          text_out = "\n".join(lines)
          print(text_out)
          if out:
              open(out, "a", encoding="utf-8").write(text_out + "\n")
          PY
